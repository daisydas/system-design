global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'my_go_servers'
    static_configs:
      - targets:
        - 'host.docker.internal:8089'
        - 'host.docker.internal:8086'
        - 'host.docker.internal:8985'
        - 'host.docker.internal:8087'
        - 'host.docker.internal:8088'
    metrics_path: /metrics
